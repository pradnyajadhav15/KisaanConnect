name: Weekly price data refresh

# Every Monday: pull the newest AGMARKNET snapshot, rebuild the dataset, retrain the
# forecaster, refresh the evaluation report, run the tests, and push the result.
# Render redeploys the backend automatically when this pushes.
# Run it by hand any time from the Actions tab (Run workflow).

on:
  schedule:
    - cron: '30 0 * * 1'   # Monday 00:30 UTC = 06:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: KisaanConnect/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            KisaanConnect/backend/requirements.txt
            KisaanConnect/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Point the dataset at the newest upstream snapshot
        run: |
          SHA=$(git ls-remote https://github.com/herrrickshaw/agri-commodity-tracker HEAD | cut -f1)
          echo "Upstream commit: $SHA"
          sed -i -E "s/^GITHUB_COMMIT = \"[0-9a-f]+\"/GITHUB_COMMIT = \"$SHA\"/" price_prediction/data/build_dataset.py
          grep '^GITHUB_COMMIT' price_prediction/data/build_dataset.py

      - name: Rebuild the dataset
        run: python -m price_prediction.data.build_dataset --download

      - name: Check for new days
        id: check
        run: |
          OLD=$(git show HEAD:KisaanConnect/backend/price_prediction/models/model_meta.json | python -c "import json,sys; print(json.load(sys.stdin)['date_to'])")
          NEW=$(python -c "import pandas as pd; print(pd.read_csv('price_prediction/data/mandi_history.csv.gz', usecols=['date'])['date'].max())")
          echo "Data in repo ends $OLD; new data ends $NEW"
          if [ "$NEW" \> "$OLD" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Retrain the forecaster
        if: steps.check.outputs.changed == 'true'
        run: python train_price_model.py

      - name: Refresh the evaluation report
        if: steps.check.outputs.changed == 'true'
        run: python -m price_prediction.evaluation.evaluate

      - name: Run tests
        if: steps.check.outputs.changed == 'true'
        run: pytest -q

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          DATE=$(python -c "import json; print(json.load(open('price_prediction/models/model_meta.json'))['date_to'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price_prediction/data/build_dataset.py price_prediction/data/mandi_history.csv.gz \
                  price_prediction/models/crop_price_model.joblib price_prediction/models/model_meta.json \
                  price_prediction/evaluation
          git commit -m "Weekly data refresh: mandi prices up to $DATE"
          git push

      - name: Nothing new
        if: steps.check.outputs.changed != 'true'
        run: echo "No new mandi data since the last refresh; nothing to retrain."
